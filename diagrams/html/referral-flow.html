    <h1>How a referral pays out</h1>

<title id="referral-flow-title">How a referral pays out</title>
<desc id="referral-flow-desc">A referrer creates a code and shares the link, the referee binds to it once, and on every referee trade the market asks the referral registry for the split, charges the referee 4% less, sends 10% of the original fee to the registry as USDC, and the referrer claims it.</desc>
