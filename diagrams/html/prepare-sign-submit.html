<title id="prepare-sign-submit-title">Prepare, sign, submit</title>
<desc id="prepare-sign-submit-desc">A trade through the gateway: the client asks the gateway to prepare a simulated, unsigned transaction, signs it locally with the wallet so the key never reaches the gateway, submits the signed XDR, and the gateway sends it to the Stellar network and reports the final status.</desc>
