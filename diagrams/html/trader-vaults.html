<title id="trader-vaults-title">How a trader vault works</title>
<desc id="trader-vaults-desc">A leader creates a vault and seeds it, depositors buy shares at full NAV while the leader keeps at least 5% of them, the leader trades the pooled USDC through the vault factory so positions belong to the vault, depositors withdraw at NAV, and the leader claims 10% of gains above the high-water mark.</desc>
