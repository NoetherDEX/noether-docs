<text x="40" y="572" class="dd-mono" font-size="10" fill="#909AAE" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="107" y="561" width="20" height="14" rx="3" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="135" y="572" class="dd-mono" font-size="11" fill="#BFC0C0" text-anchor="start" letter-spacing="0.02em">Keeper phase</text>
<rect x="245" y="561" width="20" height="14" rx="3" fill="rgba(240,138,89,0.10)" stroke="#F08A59" stroke-width="1"/>
<text x="273" y="572" class="dd-mono" font-size="11" fill="#BFC0C0" text-anchor="start" letter-spacing="0.02em">Liquidations</text>
<rect x="383" y="561" width="20" height="14" rx="3" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1"/>
<text x="411" y="572" class="dd-mono" font-size="11" fill="#BFC0C0" text-anchor="start" letter-spacing="0.02em">Chain state</text>
<path d="M 107,596 L 129,596" stroke="#BFC0C0" stroke-width="1.2" marker-end="url(#keeper-loop-a)"/>
<text x="139" y="600" class="dd-mono" font-size="11" fill="#BFC0C0" text-anchor="start" letter-spacing="0.02em">Next phase</text>
