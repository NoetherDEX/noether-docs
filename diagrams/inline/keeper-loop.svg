<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" role="img" aria-labelledby="keeper-loop-title keeper-loop-desc" class="dd-svg">
<title id="keeper-loop-title">The keeper cycle</title>
<desc id="keeper-loop-desc">The keeper bot runs a five-second cycle: it pushes signed prices every 30 seconds, liquidates isolated and cross positions, updates trailing-stop peaks after a push, executes triggered orders, applies funding hourly and extends contract TTLs every six hours, each phase writing its transactions to the chain.</desc>
<style>.dd-sans{font-family:var(--font-inter,'Inter'),system-ui,sans-serif}.dd-mono{font-family:var(--font-jetbrains-mono,'JetBrains Mono'),ui-monospace,monospace}.dd-serif{font-family:var(--font-instrument-serif,'Instrument Serif'),Georgia,serif}</style>
<defs>
<marker id="keeper-loop-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#BFC0C0"/></marker>
