<path d="M 320.000 440.000 L 320.000 330.000" fill="none" stroke="#BFC0C0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#keeper-loop-a)"/>
<path d="M 203.040 340.000 L 225.373 327.016" fill="none" stroke="#BFC0C0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#keeper-loop-a)"/>
<path d="M 203.040 204.000 L 225.373 216.984" fill="none" stroke="#BFC0C0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#keeper-loop-a)"/>
<rect x="240" y="40" width="160" height="64" rx="6" fill="#2D3142"/>
<rect x="240" y="40" width="160" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="320" y="68" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="144">Push prices</text>
<text x="320" y="87" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="144">every 30 s</text>
<rect x="412" y="140" width="160" height="64" rx="6" fill="#2D3142"/>
<rect x="412" y="140" width="160" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#F08A59" stroke-width="1"/>
<text x="492" y="168" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="144">Liquidate</text>
<text x="492" y="187" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="144">isolated, cross</text>
<rect x="412" y="340" width="160" height="64" rx="6" fill="#2D3142"/>
<rect x="412" y="340" width="160" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="492" y="368" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="144">Trailing peaks</text>
<text x="492" y="387" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="144">after a push</text>
<rect x="240" y="440" width="160" height="64" rx="6" fill="#2D3142"/>
<rect x="240" y="440" width="160" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="320" y="468" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="144">Execute orders</text>
<text x="320" y="487" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="144">limit, stops</text>
<rect x="68" y="340" width="160" height="64" rx="6" fill="#2D3142"/>
<rect x="68" y="340" width="160" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="148" y="368" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="144">Apply funding</text>
<text x="148" y="387" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="144">hourly</text>
<rect x="68" y="140" width="160" height="64" rx="6" fill="#2D3142"/>
<rect x="68" y="140" width="160" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="148" y="168" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="144">Bump TTLs</text>
<text x="148" y="187" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="144">every 6 h</text>
<rect x="220" y="220" width="200" height="104" rx="8" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1"/>
<text x="320" y="268" class="dd-sans" font-size="16" fill="#2D3142" text-anchor="middle" font-weight="600" data-maxw="184">Stellar testnet</text>
<text x="320" y="288" class="dd-mono" font-size="12" fill="#2D3142" text-anchor="middle" data-maxw="184">contract state</text>
