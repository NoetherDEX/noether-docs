<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 452" role="img" aria-labelledby="vault-flow-title vault-flow-desc" class="dd-svg">
<title id="vault-flow-title">Where the protocol vault money goes</title>
<desc id="vault-flow-desc">Depositors put USDC into the protocol vault, which takes the other side of every trade: trader fees and losses flow in and trader profits flow out; the vault routes a protocol share of fees into the insurance buffer, and to the treasury once the buffer is full; half of each liquidation penalty also goes to the buffer, which pays winning traders first.</desc>
<style>.dd-sans{font-family:var(--font-inter,'Inter'),system-ui,sans-serif}.dd-mono{font-family:var(--font-jetbrains-mono,'JetBrains Mono'),ui-monospace,monospace}.dd-serif{font-family:var(--font-instrument-serif,'Instrument Serif'),Georgia,serif}</style>
