<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 832" role="img" aria-labelledby="life-of-a-trade-title life-of-a-trade-desc" class="dd-svg">
<title id="life-of-a-trade-title">Life of a trade</title>
<desc id="life-of-a-trade-desc">Opening a position: the app fetches a signed Noeracle round, the trader signs one transaction, and inside it the router verifies and relays the price, the market reads it back and runs its risk checks, the vault reserves the payout and takes the fee, and the position_opened event returns to the app.</desc>
<style>.dd-sans{font-family:var(--font-inter,'Inter'),system-ui,sans-serif}.dd-mono{font-family:var(--font-jetbrains-mono,'JetBrains Mono'),ui-monospace,monospace}.dd-serif{font-family:var(--font-instrument-serif,'Instrument Serif'),Georgia,serif}</style>
