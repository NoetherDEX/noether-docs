<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 376" role="img" aria-labelledby="first-trade-title first-trade-desc" class="dd-svg">
<title id="first-trade-title">Your first trade</title>
<desc id="first-trade-desc">Six steps from an empty browser to a closed position: add a wallet set to Testnet, activate it through Friendbot, add the USDC trustline, claim test USDC, open a position and close it, with the wallet signatures each step needs.</desc>
<style>.dd-sans{font-family:var(--font-inter,'Inter'),system-ui,sans-serif}.dd-mono{font-family:var(--font-jetbrains-mono,'JetBrains Mono'),ui-monospace,monospace}.dd-serif{font-family:var(--font-instrument-serif,'Instrument Serif'),Georgia,serif}</style>
<defs>
<marker id="first-trade-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#BFC0C0"/></marker>
<marker id="first-trade-a-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#F08A59"/></marker>
<marker id="first-trade-a-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6A95D8"/></marker>
<marker id="first-trade-a-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#BFC0C0" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#2D3142"/>
<path d="M 240,112 L 288,112" fill="none" stroke="#BFC0C0" stroke-width="1.2" marker-end="url(#first-trade-a)"/>
<path d="M 488,112 L 536,112" fill="none" stroke="#BFC0C0" stroke-width="1.2" marker-end="url(#first-trade-a)"/>
<path d="M 636,144 L 636,176 Q 636,184 628,184 L 148,184 Q 140,184 140,192 L 140,224" fill="none" stroke="#BFC0C0" stroke-width="1.2" marker-end="url(#first-trade-a)"/>
<path d="M 240,256 L 288,256" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#first-trade-a-accent)"/>
<path d="M 488,256 L 536,256" fill="none" stroke="#BFC0C0" stroke-width="1.2" marker-end="url(#first-trade-a)"/>
<rect x="40" y="80" width="200" height="64" rx="6" fill="#2D3142"/>
<rect x="40" y="80" width="200" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="140" y="108" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="184">Add a wallet</text>
<text x="140" y="127" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="184">set it to Testnet</text>
<rect x="288" y="80" width="200" height="64" rx="6" fill="#2D3142"/>
<rect x="288" y="80" width="200" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="388" y="108" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="184">Activate</text>
<text x="388" y="127" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="184">Friendbot, no sig</text>
<rect x="536" y="80" width="200" height="64" rx="6" fill="#2D3142"/>
<rect x="536" y="80" width="200" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="636" y="108" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="184">USDC trustline</text>
<text x="636" y="127" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="184">1 signature</text>
<rect x="40" y="224" width="200" height="64" rx="6" fill="#2D3142"/>
<rect x="40" y="224" width="200" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="140" y="252" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="184">Claim test USDC</text>
<text x="140" y="271" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="184">no signature</text>
<rect x="288" y="224" width="200" height="64" rx="6" fill="#2D3142"/>
<rect x="288" y="224" width="200" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#F08A59" stroke-width="1"/>
<text x="388" y="252" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="184">Open a position</text>
<text x="388" y="271" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="184">1 signature</text>
<rect x="536" y="224" width="200" height="64" rx="6" fill="#2D3142"/>
<rect x="536" y="224" width="200" height="64" rx="6" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="636" y="252" class="dd-sans" font-size="16" fill="#F5F5F5" text-anchor="middle" font-weight="600" data-maxw="184">Close it</text>
<text x="636" y="271" class="dd-mono" font-size="12" fill="#BFC0C0" text-anchor="middle" data-maxw="184">1 signature</text>
<line x1="40" y1="320" x2="736" y2="320" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
<text x="40" y="348" class="dd-mono" font-size="10" fill="#909AAE" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="107" y="337" width="20" height="14" rx="3" fill="#393E53" stroke="#F5F5F5" stroke-width="1"/>
<text x="135" y="348" class="dd-mono" font-size="11" fill="#BFC0C0" text-anchor="start" letter-spacing="0.02em">Setup step</text>
<rect x="231" y="337" width="20" height="14" rx="3" fill="rgba(240,138,89,0.10)" stroke="#F08A59" stroke-width="1"/>
<text x="259" y="348" class="dd-mono" font-size="11" fill="#BFC0C0" text-anchor="start" letter-spacing="0.02em">Your first trade</text>
<path d="M 396,344 L 418,344" stroke="#BFC0C0" stroke-width="1.2" marker-end="url(#first-trade-a)"/>
<text x="428" y="348" class="dd-mono" font-size="11" fill="#BFC0C0" text-anchor="start" letter-spacing="0.02em">Next step</text>
</svg>
